name: Refresh GitHub activity

on:
  schedule:
    - cron: '17 4 * * *' # Daily at 06:17 in Libya (UTC+2).
  workflow_dispatch:
  push:
    paths:
      - README.md
      - .github/workflows/contributions.yml

permissions:
  contents: write

concurrency:
  group: contribution-animation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/contributions.svg?color_snake=%230969da
            assets/contributions-dark.svg?palette=github-dark&color_snake=%2358a6ff
      - name: Generate light contribution card
        uses: DenverCoder1/github-readme-streak-stats@d855de1a23fe45bdda5ffbc28a6d4b80b0f107e1 # v1
        with:
          options: user=${{ github.repository_owner }}&hide_border=true&background=FFFFFF&ring=0969DA&fire=0969DA&currStreakLabel=0969DA&disable_animations=true
          path: assets/streak.svg
      - name: Generate dark contribution card
        uses: DenverCoder1/github-readme-streak-stats@d855de1a23fe45bdda5ffbc28a6d4b80b0f107e1 # v1
        with:
          options: user=${{ github.repository_owner }}&theme=github-dark-blue&hide_border=true&background=0D1117&disable_animations=true
          path: assets/streak-dark.svg
      - name: Save generated SVGs
        run: |
          git config user.name "Abdalrhman Mohamed Balam"
          git config user.email "89781398+Abdooo2235@users.noreply.github.com"
          git add assets/contributions.svg assets/contributions-dark.svg assets/streak.svg assets/streak-dark.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: refresh GitHub activity cards"
          git push
