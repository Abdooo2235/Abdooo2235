name: Refresh contribution animation

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contribution-animation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/contributions.svg?color_snake=%230969da
            assets/contributions-dark.svg?palette=github-dark&color_snake=%2358a6ff
      - name: Save generated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contributions.svg assets/contributions-dark.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: refresh contribution animation"
          git push
